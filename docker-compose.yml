services:
  order-service:
    image: shipment-integration-lab/order-service:local
    build:
      context: ./order-service
    container_name: order-service
    environment:
      SERVER_PORT: 8001
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq
    networks:
      - shipment-integration-net

  shipment-integration-service:
    image: shipment-integration-lab/shipment-integration-service:local
    build:
      context: ./shipment-integration-service
    container_name: shipment-integration-service
    environment:
      SERVER_PORT: 8002
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      CARRIER_MOCK_URL: http://carrier-mock-service:8003/api/v1/carrier
    ports:
      - "8002:8002"
    depends_on:
      - rabbitmq
      - carrier-mock-service
    networks:
      - shipment-integration-net

  carrier-mock-service:
    image: shipment-integration-lab/carrier-mock-service:local
    build:
      context: ./carrier-mock-service
    container_name: carrier-mock-service
    environment:
      SERVER_PORT: 8003
    ports:
      - "8003:8003"
    networks:
      - shipment-integration-net

  qa-service:
    image: shipment-integration-lab/qa-service:local
    build:
      context: ./qa-service
    container_name: qa-service
    environment:
      SERVER_PORT: 8004
    ports:
      - "8004:8004"
    networks:
      - shipment-integration-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: shipment-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - shipment-integration-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: shipment-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
    networks:
      - shipment-integration-net

  kong:
    image: kong:3.7
    container_name: shipment-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./infra/kong/kong.yaml:/etc/kong/kong.yaml:ro
    depends_on:
      - order-service
      - shipment-integration-service
      - carrier-mock-service
      - qa-service
    networks:
      - shipment-integration-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: shipment-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - shipment-integration-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: shipment-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - shipment-integration-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: shipment-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - shipment-integration-net

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.18
    container_name: shipment-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - shipment-integration-net

  fluent-bit:
    image: fluent/fluent-bit:3.0.0
    container_name: shipment-fluentbit
    volumes:
      - ./infra/efk/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infra/efk/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      - elasticsearch
    networks:
      - shipment-integration-net

networks:
  shipment-integration-net:
    name: shipment-integration-net
