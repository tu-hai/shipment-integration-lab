services:
  order-service:
    image: shipment-integration-lab/order-service:local
    container_name: order-service
    environment:
      SERVER_PORT: ${ORDER_SERVICE_PORT:-8001}
    ports:
      - "${ORDER_SERVICE_PORT:-8001}:8001"
    networks:
      - shipment-integration-net

  shipment-integration-service:
    image: shipment-integration-lab/shipment-integration-service:local
    container_name: shipment-integration-service
    environment:
      SERVER_PORT: ${SHIPMENT_INTEGRATION_SERVICE_PORT:-8002}
    ports:
      - "${SHIPMENT_INTEGRATION_SERVICE_PORT:-8002}:8002"
    depends_on:
      - rabbitmq
    networks:
      - shipment-integration-net

  carrier-mock-service:
    image: shipment-integration-lab/carrier-mock-service:local
    container_name: carrier-mock-service
    environment:
      SERVER_PORT: ${CARRIER_MOCK_SERVICE_PORT:-8003}
    ports:
      - "${CARRIER_MOCK_SERVICE_PORT:-8003}:8003"
    networks:
      - shipment-integration-net

  qa-service:
    image: shipment-integration-lab/qa-service:local
    container_name: qa-service
    environment:
      SERVER_PORT: ${QA_SERVICE_PORT:-8004}
    ports:
      - "${QA_SERVICE_PORT:-8004}:8004"
    networks:
      - shipment-integration-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: shipment-rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./infra/rabbitmq:/etc/rabbitmq
    networks:
      - shipment-integration-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: shipment-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
    networks:
      - shipment-integration-net

  kong:
    image: kong:3.7
    container_name: shipment-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    volumes:
      - ./infra/kong/kong.yaml:/etc/kong/kong.yaml:ro
    depends_on:
      - order-service
      - shipment-integration-service
      - carrier-mock-service
      - qa-service
    networks:
      - shipment-integration-net

networks:
  shipment-integration-net:
    name: shipment-integration-net
